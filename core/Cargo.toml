[package]
name = "romcal-core"
version = "4.0.0"
edition = "2021"
authors = ["Romcal Contributors"]
description = "Liturgical Calendar Library - Core Rust library"
license = "MIT"
repository = "https://github.com/romcal/romcal"
keywords = ["liturgical", "calendar", "catholic", "romcal"]
categories = ["date-and-time", "web-programming"]

[lib]
crate-type = ["rlib"]

[dependencies]
chrono = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
strum = { version = "0.27", features = ["derive"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.22.0"
serde_test = "1.0"

[[bin]]
name = "generate-schema"
path = "src/bin/generate_schema.rs"
