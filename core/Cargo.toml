[package]
name = "romcal-core"
version = "4.0.0"
edition = "2021"
authors = ["Romcal Contributors"]
description = "Liturgical Calendar Library - Core Rust library"
license = "MIT"
repository = "https://github.com/romcal/romcal"
keywords = ["liturgical", "calendar", "catholic", "romcal"]
categories = ["date-and-time", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
schemars = "0.8"
serde = { workspace = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
wasm-bindgen = { workspace = true }

[[bin]]
name = "generate-schema"
path = "src/bin/generate_schema.rs"
