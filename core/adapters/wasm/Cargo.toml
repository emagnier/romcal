[package]
name = "romcal-core-wasm"
version = "4.0.0-beta.1"
edition = "2024"
authors = ["Étienne Magnier <etienne.magnier@gmail.com>"]
description = "WebAssembly bindings for romcal-core liturgical calendar library"
license = "Apache-2.0"
repository = "https://github.com/romcal/romcal"
keywords = ["liturgical", "calendar", "catholic", "wasm", "webassembly"]
categories = ["date-and-time", "wasm", "web-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
romcal-core = { path = "../../" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
