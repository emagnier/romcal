[package]
name = "romcal"
version = "4.0.0"
authors = ["Romcal Contributors"]
description = "Liturgical Calendar Library - WASM bindings"
license = "MIT"
repository = "https://github.com/romcal/romcal"
keywords = ["liturgical", "calendar", "catholic", "romcal", "wasm"]
categories = ["web-programming", "date-and-time"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["-Os", "--enable-mutable-globals"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-mutable-globals"]
