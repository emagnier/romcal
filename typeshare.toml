# Typeshare configuration for romcal bindings
# See: https://1password.github.io/typeshare/usage/configuration.html
#
# Note: TypeScript uses ts-rs instead of Typeshare (better support for untagged enums)
# See: bindings/typescript/package.json for ts-rs configuration

[swift]
prefix = ""

[swift.type_mappings]
"BTreeMap<K, V>" = "[K: V]"

[kotlin]
package = "com.romcal.types"
module_name = "RomcalTypes"

[kotlin.type_mappings]
"BTreeMap<K, V>" = "Map<K, V>"
