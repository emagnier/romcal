[package]
name = "romcal-cli"
version = "4.0.0"
edition = "2021"
authors = ["Romcal Contributors"]
description = "Interface en ligne de commande pour Romcal - Calculateur de calendrier liturgique"
license = "MIT"
repository = "https://github.com/romcal/romcal"
keywords = ["liturgical", "calendar", "catholic", "cli"]
categories = ["command-line-utilities", "date-and-time"]

[[bin]]
name = "romcal"
path = "src/main.rs"

[dependencies]
romcal-core = { path = "../core" }
clap = { version = "4.4", features = ["derive", "color"] }
clap_complete = "4.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.10"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
log = "0.4"
env_logger = "0.11"
jsonschema = { version = "0.33", default-features = false }
glob = "0.3"
toml = "0.8"
dirs = "5.0"
