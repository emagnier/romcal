[package]
name = "romcal-cli"
version = "4.0.0-beta.2"
edition = "2024"
authors = ["Étienne Magnier <etienne.magnier@gmail.com>"]
description = "A CLI for calculating Catholic liturgical dates and generating calendars"
license = "Apache-2.0"
repository = "https://github.com/emagnier/romcal"
homepage = "https://github.com/emagnier/romcal/tree/v4/cli"
readme = "README.md"
keywords = ["liturgical", "calendar", "catholic", "christian", "easter"]
categories = ["command-line-utilities", "date-and-time"]

[[bin]]
name = "romcal"
path = "src/main.rs"

[dependencies]
romcal = { version = "4.0.0-beta.2", path = "../core" }
clap = { version = "4.5", features = ["derive", "color"] }
clap_complete = "4.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.0"
serde-saphyr = "0.0.11"
csv = "1.4"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
log = "0.4"
env_logger = "0.11"
jsonschema = { version = "0.37", default-features = false }
glob = "0.3"
toml = "0.9"
dirs = "6.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
