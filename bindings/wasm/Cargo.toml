[package]
name = "romcal-wasm"
version = "4.0.0-beta.6"
edition = "2024"
authors = ["Étienne Magnier <etienne.magnier@gmail.com>"]
description = "WebAssembly bindings for romcal liturgical calendar library"
license = "Apache-2.0"
repository = "https://github.com/romcal/romcal"
keywords = ["liturgical", "calendar", "catholic", "wasm", "webassembly"]
categories = ["date-and-time", "wasm", "web-programming"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
romcal = { path = "../../core" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
