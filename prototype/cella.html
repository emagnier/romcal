<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cella</title>
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --parchment:#FAF7F2;--parchment-warm:#F0EBE3;
  --ink-dark:#1C1A17;--ink-dark-sec:#2A2722;
  --text-primary:#2C2520;--text-secondary:#7A7067;--text-tertiary:#A89F95;
  --accent-letrine:#8B1A1A;--accent-gold:#C4956A;--separator:#E8E2DA;
  --lit-white:#C4956A;--lit-red:#8B1A1A;--lit-green:#4A6741;
  --lit-violet:#5B3A6B;--lit-rose:#B07A8A;--lit-black:#2C2520;
  --lit-current:#5B3A6B;
  --radius-card:14px;--radius-sm:8px;
  --pad-h:24px;--pad-card:20px;
  --font-serif:'Georgia','Times New Roman',serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html{font-size:16px}
body{
  font-family:var(--font-sans);background:var(--parchment-warm);
  color:var(--text-primary);-webkit-font-smoothing:antialiased;
  max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}

/* ========== TYPOGRAPHY ========== */
.t-serif{font-family:var(--font-serif)}
.t-label{font-family:var(--font-sans);font-weight:500}
.t-section{font-family:var(--font-sans);font-weight:500;font-size:11px;color:var(--text-tertiary);letter-spacing:1.5px;text-transform:uppercase}
.t-caption{font-size:12px;color:var(--text-tertiary)}
.t-secondary{color:var(--text-secondary)}
.t-tertiary{color:var(--text-tertiary)}
.t-accent{color:var(--lit-current)}

/* ========== LAYOUT ========== */
.app-container{flex:1;display:flex;flex-direction:column;height:100vh}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.lit-bar{height:3px;background:var(--lit-current);flex-shrink:0}
.content-pad{padding:16px var(--pad-h) 100px}
.section{margin-bottom:32px}
.section-header{margin-bottom:12px}

/* ========== CARD ========== */
.card{
  padding:var(--pad-card);background:var(--parchment);
  border-radius:var(--radius-card);border:0.5px solid var(--separator);
  position:relative;
}
.card--lit{padding-left:calc(var(--pad-card) + 8px)}
.card--lit::before{
  content:'';position:absolute;left:8px;top:8px;bottom:8px;width:3px;
  background:var(--lit-current);border-radius:2px;
}

/* ========== TAB BAR ========== */
.tab-bar{
  display:flex;background:var(--parchment);border-top:0.5px solid var(--separator);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));flex-shrink:0;
  position:sticky;bottom:0;z-index:100;
}
.tab-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 0;cursor:pointer;border:none;background:none;
  color:var(--text-tertiary);transition:color .2s;font-size:10px;
}
.tab-item.active{color:var(--lit-current)}
.tab-item svg{width:22px;height:22px;fill:currentColor}

/* ========== BUTTONS ========== */
.btn-pill{
  display:inline-block;padding:8px 14px;border-radius:100px;font-size:12px;
  border:0.5px solid var(--separator);background:var(--parchment-warm);
  color:var(--text-secondary);cursor:pointer;font-family:var(--font-sans);
}
.btn-accent{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:100px;background:color-mix(in srgb,var(--lit-current) 8%,transparent);
  color:var(--lit-current);border:none;cursor:pointer;font-size:13px;font-family:var(--font-sans);
}

/* ========== RADIO ========== */
.radio{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--text-tertiary);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
}
.radio.selected{border-color:var(--lit-current)}
.radio.selected::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--lit-current)}

/* ========== TOGGLE ========== */
.toggle{
  width:44px;height:26px;border-radius:13px;background:var(--separator);
  position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;
}
.toggle.on{background:var(--accent-gold)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;
  border-radius:50%;background:white;transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.toggle.on::after{transform:translateX(18px)}

/* ========== LISTS ========== */
.list-group{background:var(--parchment);border-radius:var(--radius-card);border:0.5px solid var(--separator);overflow:hidden}
.list-row{display:flex;align-items:center;gap:14px;padding:14px var(--pad-card);cursor:pointer}
.list-row:not(:last-child){border-bottom:0.5px solid var(--separator)}
.list-row .icon{width:28px;text-align:center;color:var(--text-secondary);font-size:18px}
.list-row .chevron{color:var(--text-tertiary);font-size:12px;margin-left:auto}
.list-row .badge{font-size:11px;color:var(--text-tertiary);padding:4px 10px;background:var(--parchment-warm);border-radius:100px}

/* ========== OFFICE GRID ========== */
.office-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.office-cell{
  text-align:center;padding:12px 4px;background:var(--parchment);
  border-radius:var(--radius-sm);border:0.5px solid var(--separator);cursor:pointer;
}
.office-cell.suggested{background:color-mix(in srgb,var(--lit-current) 8%,transparent);border-color:color-mix(in srgb,var(--lit-current) 30%,transparent)}
.office-cell .name{font-size:12px;font-weight:500}
.office-cell.suggested .name{color:var(--lit-current)}
.office-cell .marker{height:10px;display:flex;align-items:center;justify-content:center;margin-top:4px}

/* ========== READING ========== */
.lettrine{float:left;font-size:52px;font-weight:700;font-family:var(--font-serif);color:var(--lit-current);line-height:.85;margin:0 6px 0 0}
.reading-text{font-family:var(--font-serif);font-size:15.5px;line-height:1.65;color:var(--text-primary)}
.reading-sep{display:flex;align-items:center;gap:0;margin:24px 0}
.reading-sep .line{flex:1;height:0.5px;background:var(--separator)}
.reading-sep .label{padding:0 12px;font-size:11px;color:var(--text-tertiary);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;font-weight:500}
.psalm-response{display:flex;align-items:baseline;gap:6px;padding:6px 0}
.psalm-response .r{font-size:18px;font-weight:700;font-family:var(--font-serif);color:var(--lit-current)}
.psalm-response .text{font-family:var(--font-serif);font-size:15px;font-weight:500;font-style:italic}

/* ========== ANTIPHON ========== */
.antiphon{
  display:flex;gap:10px;padding:14px;
  background:color-mix(in srgb,var(--lit-current) 5%,transparent);
  border-radius:var(--radius-sm);
}
.antiphon .ant-label{font-family:var(--font-serif);font-size:13px;font-weight:500;color:var(--lit-current);width:32px;flex-shrink:0}
.antiphon .ant-text{font-family:var(--font-serif);font-size:15px;font-weight:500;font-style:italic}

/* ========== OFFICE DETAIL ========== */
.office-section{margin-bottom:28px}
.office-section .section-title{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.office-section .section-title .main{font-size:11px;font-weight:500;color:var(--text-tertiary);letter-spacing:1.5px;text-transform:uppercase}
.office-section .section-title .sub{font-family:var(--font-serif);font-size:13px;font-style:italic;color:var(--text-tertiary)}
.prayer-text{font-family:var(--font-serif);font-size:15.5px;line-height:1.65;color:var(--text-primary);white-space:pre-line}
.response-line{color:var(--text-secondary)}
.bold-response{font-weight:500;color:var(--text-primary)}

/* ========== SEPARATOR ========== */
.divider-symbol{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider-symbol .line{flex:1;height:0.5px;background:var(--separator)}
.divider-symbol .sym{color:var(--separator);font-size:8px}

/* ========== SLIDER ========== */
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--lit-current)}
.slider-row .small-a{font-family:var(--font-serif);font-size:13px;color:var(--text-tertiary)}
.slider-row .big-a{font-family:var(--font-serif);font-size:22px;color:var(--text-tertiary)}

/* ========== THEME CARDS ========== */
.theme-cards{display:flex;gap:12px}
.theme-card{
  flex:1;text-align:center;cursor:pointer;
}
.theme-card .preview{
  height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  border:0.5px solid var(--separator);margin-bottom:8px;font-size:18px;
}
.theme-card.selected .preview{border:2px solid var(--lit-current)}
.theme-card .label{font-size:12px;color:var(--text-secondary)}
.theme-card.selected .label{color:var(--text-primary)}

/* ========== COLOR DOTS ========== */
.color-dots{display:flex;gap:12px;justify-content:center;margin-top:8px}
.color-dot{text-align:center}
.color-dot .dot{width:24px;height:24px;border-radius:50%;margin:0 auto 4px}
.color-dot .name{font-size:10px;color:var(--text-tertiary)}

/* ========== MODAL (bottom sheet) ========== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
  display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal-sheet{
  background:var(--parchment);border-radius:16px 16px 0 0;
  width:100%;max-width:430px;max-height:70vh;overflow-y:auto;
  padding:12px var(--pad-h) 32px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--separator);margin:0 auto 16px}

/* ========== SUB-PAGE ========== */
.sub-page{
  position:absolute;inset:0;background:var(--parchment-warm);z-index:50;
  transform:translateX(100%);transition:transform .3s ease;
  display:flex;flex-direction:column;
}
.sub-page.active{transform:translateX(0)}
.sub-page-header{
  display:flex;align-items:center;padding:12px var(--pad-h);
  border-bottom:0.5px solid var(--separator);background:var(--parchment);
  flex-shrink:0;
}
.sub-page-header .back{cursor:pointer;color:var(--lit-current);font-size:14px;display:flex;align-items:center;gap:4px}
.sub-page-header .title{flex:1;text-align:center;font-size:15px;font-weight:500;margin-right:60px}
.sub-page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ========== ANIMATIONS ========== */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ========== SCROLLBAR ========== */
.tab-content::-webkit-scrollbar,.sub-page-body::-webkit-scrollbar{width:0}
</style>
</head>

let currentTab = 'today';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  renderTab(tab);
  document.getElementById('tabContent').scrollTop = 0;
}

function renderTab(tab) {
  const el = document.getElementById('tabContent');
  const renderers = { today: renderToday, readings: renderReadings, hours: renderHours, more: renderMore };
  el.innerHTML = renderers[tab]();
}

// ===================================================================
// OFFICE DETAIL (sub-page)
// ===================================================================
function openOfficeDetail() {
  openSubPage('office', 'Laudes', renderOfficeDetail);
}

let guidedMode = false;
let guidedStep = 0;

function renderOfficeDetail() {
  const sections = DATA.laudsSections;
  const visibleSections = guidedMode ? sections.slice(0, guidedStep + 1) : sections;

  let html = `
    <div style="text-align:center;margin-bottom:20px">
      <div class="t-section" style="margin-bottom:6px">LAUDES — Prière du matin</div>
      <div class="t-serif" style="font-size:16px">${DATA.title}</div>
      <div class="t-caption" style="margin-top:4px">Liturgie des Heures (Église)</div>
    </div>

    <div style="text-align:center;margin-bottom:24px">
      <button class="btn-accent" onclick="guidedMode=!guidedMode;guidedStep=0;refreshSubPage('office','Laudes',renderOfficeDetail)">
        ${guidedMode?'&#128213; Mode continu':'&#128214; Prier pas à pas'}
      </button>
    </div>`;

  visibleSections.forEach((s, i) => {
    if (i > 0) {
      html += `<div class="divider-symbol"><div class="line"></div><span class="sym">&#10022;</span><div class="line"></div></div>`;
    }

    html += `<div class="office-section">`;
    html += `<div class="section-title"><span class="main">${s.title}</span>${s.subtitle?`<span class="sub">${s.subtitle}</span>`:''}</div>`;

    if (s.antiphon) {
      html += `<div class="antiphon"><span class="ant-label">Ant.</span><span class="ant-text">${s.text}</span></div>`;
    } else if (s.response) {
      html += `<div class="prayer-text">${s.text.split('\n').map(line =>
        line.startsWith('℟') ? `<span class="bold-response">${line}</span>` : `<span class="response-line">${line}</span>`
      ).join('<br>')}</div>`;
    } else {
      html += `<div class="prayer-text">${s.text}</div>`;
    }
    html += `</div>`;
  });

  if (guidedMode && guidedStep < sections.length - 1) {
    html += `<div style="text-align:center;margin:20px 0">
      <button style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:100px;background:var(--lit-current);color:white;border:none;cursor:pointer;font-size:14px;font-weight:500;font-family:var(--font-sans)" onclick="guidedStep++;refreshSubPage('office','Laudes',renderOfficeDetail)">
        Suite <span style="font-size:12px">&#9662;</span>
      </button>
    </div>`;
  }

  return html;
}

// ===================================================================
// HELPERS
// ===================================================================
function renderToggleRow(title, subtitle, id, on) {
  return `<div class="list-row" style="cursor:pointer" onclick="toggleSwitch('${id}',this)">
    <div style="flex:1"><div class="t-label" style="font-size:15px">${title}</div><div class="t-caption" style="margin-top:3px">${subtitle}</div></div>
    <div class="toggle ${on?'on':''}" data-toggle="${id}"></div>
  </div>`;
}

function toggleSwitch(id, el) {
  const toggle = el.querySelector('.toggle');
  toggle.classList.toggle('on');
}

function renderRadioRow(title, selected, group, value) {
  return `<div class="list-row" style="cursor:pointer" onclick="selectRadio('${group}','${value}',this)">
    <div class="radio ${selected?'selected':''}" data-group="${group}"></div>
    <span style="font-size:15px;${selected?'color:var(--text-primary)':'color:var(--text-secondary)'}">${title}</span>
  </div>`;
}

function selectRadio(group, value, el) {
  const parent = el.parentElement;
  parent.querySelectorAll(`[data-group="${group}"]`).forEach(r => r.classList.remove('selected'));
  el.querySelector('.radio').classList.add('selected');
  parent.querySelectorAll('.list-row').forEach(r => {
    const span = r.querySelector('span:last-child');
    if(span) span.style.color = 'var(--text-secondary)';
  });
  const span = el.querySelector('span:last-child');
  if(span) span.style.color = 'var(--text-primary)';

  if(group==='community') {
    comSettings.community = value;
    refreshSubPage('community','Communauté religieuse',renderCommunitySettings);
  }
}

function showModal(title, text) {
  document.getElementById('modalContent').innerHTML = `
    <h3 class="t-label" style="font-size:15px;margin-bottom:16px">${title}</h3>
    <div class="t-serif" style="font-size:16px;line-height:1.65">${text}</div>`;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('active');
}
