[workspace]
members = [
    "core",
]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"

[workspace.dependencies.web-sys]
version = "0.3"
features = [
  "console",
]
