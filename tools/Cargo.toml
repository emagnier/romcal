[package]
name = "romcal-tools"
version = "4.0.0"
edition = "2021"
authors = ["Romcal Contributors"]
description = "Development tools for Romcal"

[[bin]]
name = "validate-calendars"
path = "src/validate_calendars.rs"

[dependencies]
romcal-core = { path = "../core" }
jsonschema = { version = "0.33", default-features = false }
serde_json = { version = "1.0", features = ["std"] }
walkdir = "2.5"
