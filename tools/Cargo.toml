[package]
name = "romcal-tools"
version = "4.0.0-beta.4"
edition = "2021"
authors = ["Étienne Magnier <etienne.magnier@gmail.com>"]
description = "Development tools for Romcal"
publish = false

[[bin]]
name = "validate-json"
path = "src/validate_json.rs"

[dependencies]
romcal = { path = "../core" }
jsonschema = { version = "0.33", default-features = false }
serde_json = { version = "1.0", features = ["std"] }
walkdir = "2.5"
glob = "0.3"
