<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Globe circle -->
  <circle cx="32" cy="32" r="24" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <!-- Vertical meridian -->
  <ellipse cx="32" cy="32" rx="10" ry="24" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Horizontal parallel (equator) -->
  <path d="M8 32c0 0 10-6 24-6s24 6 24 6" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Upper parallel -->
  <path d="M12 22c0 0 8-4 20-4s20 4 20 4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Lower parallel -->
  <path d="M12 42c0 0 8 4 20 4s20-4 20-4" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Small cross marker -->
  <circle cx="44" cy="20" r="4" fill="currentColor"/>
  <path d="M44 17v6M41 20h6" stroke="var(--ifm-background-color, white)" stroke-width="1.5" stroke-linecap="round"/>
