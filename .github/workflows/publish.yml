name: Publish

on:
  # Manual trigger with dry-run option
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no actual publish)"
        required: true
        default: true
        type: boolean
      target:
        description: "What to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - crates
          - npm
          - pypi

  # Trigger on version tags
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # PREPARE (read version, determine dry-run mode)
  # ============================================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry-run: ${{ steps.config.outputs.dry-run }}
      publish-crates: ${{ steps.config.outputs.publish-crates }}
      publish-npm: ${{ steps.config.outputs.publish-npm }}
      publish-pypi: ${{ steps.config.outputs.publish-pypi }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Configure publish settings
        id: config
        run: |
          # Determine dry-run mode
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY_RUN="${{ inputs.dry-run }}"
            TARGET="${{ inputs.target }}"
          else
            # For tag pushes, default to dry-run for safety
            # Set to 'false' when ready for real releases
            DRY_RUN="true"
            TARGET="all"
          fi

          echo "dry-run=$DRY_RUN" >> $GITHUB_OUTPUT

          # Determine what to publish
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "crates" ]; then
            echo "publish-crates=true" >> $GITHUB_OUTPUT
          else
            echo "publish-crates=false" >> $GITHUB_OUTPUT
          fi

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "npm" ]; then
            echo "publish-npm=true" >> $GITHUB_OUTPUT
          else
            echo "publish-npm=false" >> $GITHUB_OUTPUT
          fi

          if [ "$TARGET" = "all" ] || [ "$TARGET" = "pypi" ]; then
            echo "publish-pypi=true" >> $GITHUB_OUTPUT
          else
            echo "publish-pypi=false" >> $GITHUB_OUTPUT
          fi

          echo "🔧 Configuration:"
          echo "   Dry run: $DRY_RUN"
          echo "   Target: $TARGET"

  # ============================================================================
  # CRATES.IO - CORE (romcal)
  # ============================================================================
  crates-core:
    name: Crates.io (core)
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.publish-crates == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "publish-crates-core"

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) doesn't match VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $FILE_VERSION"

      - name: Publish romcal
        run: |
          if [ "${{ needs.prepare.outputs.dry-run }}" = "true" ]; then
            echo "🧪 Dry run: cargo publish --package romcal"
            cargo publish --package romcal --dry-run
          else
            echo "🚀 Publishing romcal to crates.io"
            cargo publish --package romcal --token ${{ secrets.CRATES_IO_TOKEN }}
          fi

      - name: Wait for crates.io index update
        if: needs.prepare.outputs.dry-run == 'false'
        run: |
          echo "⏳ Waiting 30s for crates.io index to update..."
          sleep 30

  # ============================================================================
  # CRATES.IO - CLI (romcal-cli)
  # ============================================================================
  crates-cli:
    name: Crates.io (cli)
    runs-on: ubuntu-latest
    needs: [prepare, crates-core]
    if: needs.prepare.outputs.publish-crates == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "publish-crates-cli"

      - name: Publish romcal-cli
        run: |
          if [ "${{ needs.prepare.outputs.dry-run }}" = "true" ]; then
            # Skip dry-run for cli: cargo package/publish checks crates.io for the
            # romcal dependency which isn't published yet. Build validation is
            # already done in CI, and real publish will work after core is on crates.io.
            echo "⏭️ Skipping romcal-cli dry-run"
            echo "ℹ️ Reason: romcal dependency not yet on crates.io"
            echo "ℹ️ Build validation already done in CI workflow"
          else
            echo "🚀 Publishing romcal-cli to crates.io"
            cargo publish --package romcal-cli --token ${{ secrets.CRATES_IO_TOKEN }}
          fi

  # ============================================================================
  # NPM (romcal TypeScript/WASM)
  # ============================================================================
  npm:
    name: npm
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.publish-npm == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "publish-npm"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: bindings/typescript/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Build WASM
        run: wasm-pack build bindings/wasm --target web --out-dir ../typescript/pkg

      - name: Install dependencies
        working-directory: bindings/typescript
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        working-directory: bindings/typescript
        run: pnpm build:vite

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./bindings/typescript/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Publish to npm
        working-directory: bindings/typescript
        run: |
          if [ "${{ needs.prepare.outputs.dry-run }}" = "true" ]; then
            echo "🧪 Dry run: pnpm publish"
            pnpm publish --dry-run
          else
            echo "🚀 Publishing to npm"
            pnpm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================================
  # NPM - UNPLUGIN (@romcal/unplugin)
  # ============================================================================
  npm-unplugin:
    name: npm (unplugin)
    runs-on: ubuntu-latest
    needs: [prepare, npm]
    if: needs.prepare.outputs.publish-npm == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: bindings/unplugin/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: bindings/unplugin/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: bindings/unplugin
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: bindings/unplugin
        run: pnpm build

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./bindings/unplugin/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Publish to npm
        working-directory: bindings/unplugin
        run: |
          if [ "${{ needs.prepare.outputs.dry-run }}" = "true" ]; then
            echo "🧪 Dry run: pnpm publish"
            pnpm publish --dry-run
          else
            echo "🚀 Publishing @romcal/unplugin to npm"
            pnpm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ============================================================================
  # PYPI - WHEELS (multi-platform builds)
  # ============================================================================
  pypi-wheels:
    name: Wheel py${{ matrix.python }} / ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    needs: [prepare]
    if: needs.prepare.outputs.publish-pypi == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          # Linux x86_64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # Linux aarch64 (glibc)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          # Linux x86_64 (musl - Alpine)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          # Linux aarch64 (musl - Alpine)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          # macOS x86_64 (Intel)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            manylinux: auto
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
          # Windows arm64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            manylinux: auto
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
          working-directory: bindings/python

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-py${{ matrix.python }}-${{ matrix.platform.target }}
          path: bindings/python/dist/*.whl

  # ============================================================================
  # PYPI - SOURCE DISTRIBUTION
  # ============================================================================
  pypi-sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.publish-pypi == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Build source distribution
        working-directory: bindings/python
        run: uvx maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  # ============================================================================
  # PYPI - PUBLISH (collect all wheels + sdist)
  # ============================================================================
  pypi-publish:
    name: PyPI Publish
    runs-on: ubuntu-latest
    needs: [prepare, pypi-wheels, pypi-sdist]
    if: needs.prepare.outputs.publish-pypi == 'true'
    permissions:
      id-token: write # Required for PyPI Trusted Publishers (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(grep -m1 '^version = ' bindings/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) doesn't match pyproject.toml ($PKG_VERSION)"
            exit 1
          fi
          echo "✅ Version verified: $PKG_VERSION"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*
          # NOTE: Do NOT use merge-multiple: true - it corrupts Windows wheels

      - name: Consolidate wheels
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -type f -exec mv {} dist/ \;
          rm -rf artifacts
          echo "📦 Consolidated $(ls dist/*.whl | wc -l) wheel files"

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List distributions
        run: |
          echo "📦 Distributions to publish:"
          ls -la dist/
          echo ""
          echo "Total: $(ls dist/ | wc -l) files"

      - name: Validate wheels
        run: |
          for wheel in dist/*.whl; do
            python -m zipfile -t "$wheel" || {
              echo "❌ Corrupted wheel: $wheel"
              exit 1
            }
          done
          echo "✅ All wheels are valid ZIP files"

      - name: Check distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Publish to PyPI
        if: needs.prepare.outputs.dry-run == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Dry run summary
        if: needs.prepare.outputs.dry-run == 'true'
        run: |
          echo "🧪 Dry run complete"
          echo "📦 Would publish $(ls dist/ | wc -l) files to PyPI"

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [prepare, crates-core, crates-cli, npm, npm-unplugin, pypi-publish]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.prepare.outputs.publish-crates }}" = "true" ]; then
            if [ "${{ needs.crates-core.result }}" = "success" ]; then
              echo "| crates.io (romcal) | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| crates.io (romcal) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ needs.crates-cli.result }}" = "success" ]; then
              echo "| crates.io (romcal-cli) | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| crates.io (romcal-cli) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| crates.io | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.prepare.outputs.publish-npm }}" = "true" ]; then
            if [ "${{ needs.npm.result }}" = "success" ]; then
              echo "| npm (romcal) | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| npm (romcal) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${{ needs.npm-unplugin.result }}" = "success" ]; then
              echo "| npm (@romcal/unplugin) | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| npm (@romcal/unplugin) | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| npm | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.prepare.outputs.publish-pypi }}" = "true" ]; then
            if [ "${{ needs.pypi-publish.result }}" = "success" ]; then
              echo "| PyPI | ✅ Success (32 wheels + sdist) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| PyPI | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| PyPI | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ needs.prepare.outputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
